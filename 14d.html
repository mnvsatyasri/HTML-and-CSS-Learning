<!DOCTYPE html>
<html>
    <head>
        <title>Modal</title>
    </head>
    <body style="
    height: 3000px;">
        <div style="
            background-color: green;
            color: white;
            width: 100px;
            right: 0;
            top: 0;
            bottom: 0;
            position: fixed;">
            right sidebar
        </div>

        <div style="
            background-color: rgba(0,0,0,0.5);
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;">
            <div style="background-color: white;
                width: 300px;
                padding-bottom: 15px;
                padding-left: 15px;
                padding-right: 15px;
                padding-top: 15px;
                border-radius: 5px;">
                <div style="
                    font-family: Arial;
                    font-weight: bold;
                    font-size: 24px;
                    margin-bottom: 12px;">
                        Modal Title
                </div>
                <div style="
                    font-family: Arial;
                    margin-bottom: 12px;">
                        This is a modal
                </div>
                <button>
                    Close
                </button>
            </div>
        </div>
    </body>
</html>
